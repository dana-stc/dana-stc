<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Three Java threads waiting for a lock and entering the critical section one at a time">
  <style>
    .lane { stroke: #8b949e; stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 4 6; }
    .label { fill: #8b949e; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .small { fill: #8b949e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .zone { fill: #d29922; fill-opacity: .08; stroke: #d29922; stroke-width: 2; rx: 10; }
    .glow { fill: #d29922; opacity: 0; animation: glow 9s infinite; rx: 10; }
    .t { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .t0 { animation-name: m0; fill: #2f81f7; }
    .t1 { animation-name: m1; fill: #a371f7; }
    .t2 { animation-name: m2; fill: #3fb950; }
    .name { fill: #fff; font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }

    @keyframes m0 {
      0% { transform: translateX(0); opacity: 1 }
      10% { transform: translateX(220px) }
      14% { transform: translateX(220px) }
      30% { transform: translateX(560px); opacity: 1 }
      32% { transform: translateX(560px); opacity: 0 }
      33% { transform: translateX(0); opacity: 0 }
      40%, 100% { transform: translateX(0); opacity: 1 }
    }
    @keyframes m1 {
      0% { transform: translateX(0); opacity: 1 }
      10% { transform: translateX(220px) }
      36% { transform: translateX(220px) }
      55% { transform: translateX(560px); opacity: 1 }
      57% { transform: translateX(560px); opacity: 0 }
      58% { transform: translateX(0); opacity: 0 }
      65%, 100% { transform: translateX(0); opacity: 1 }
    }
    @keyframes m2 {
      0% { transform: translateX(0); opacity: 1 }
      10% { transform: translateX(220px) }
      68% { transform: translateX(220px) }
      88% { transform: translateX(560px); opacity: 1 }
      90% { transform: translateX(560px); opacity: 0 }
      91% { transform: translateX(0); opacity: 0 }
      96%, 100% { transform: translateX(0); opacity: 1 }
    }
    @keyframes glow {
      0%, 13% { opacity: 0 }
      15%, 29% { opacity: .22 }
      31%, 36% { opacity: 0 }
      38%, 54% { opacity: .22 }
      56%, 69% { opacity: 0 }
      71%, 87% { opacity: .22 }
      89%, 100% { opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .t, .glow { animation: none }
    }
  </style>

  <text x="360" y="26" class="label" text-anchor="middle">synchronized / ReentrantLock: one thread at a time</text>

  <!-- lanes -->
  <line x1="40" y1="80" x2="680" y2="80" class="lane"/>
  <line x1="40" y1="130" x2="680" y2="130" class="lane"/>
  <line x1="40" y1="180" x2="680" y2="180" class="lane"/>

  <!-- critical section -->
  <rect x="300" y="52" width="120" height="156" class="zone"/>
  <rect x="300" y="52" width="120" height="156" class="glow"/>
  <text x="360" y="226" class="small" text-anchor="middle">critical section 🔒</text>

  <!-- threads -->
  <g class="t t0"><circle cx="60" cy="80" r="14"/><text x="60" y="84" class="name">T1</text></g>
  <g class="t t1"><circle cx="60" cy="130" r="14"/><text x="60" y="134" class="name">T2</text></g>
  <g class="t t2"><circle cx="60" cy="180" r="14"/><text x="60" y="184" class="name">T3</text></g>

  <text x="60" y="226" class="small" text-anchor="middle">threads</text>
  <text x="640" y="226" class="small" text-anchor="middle">done</text>
</svg>
